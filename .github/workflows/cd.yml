# ITCS355 Lab 4 — continuous deployment.
#
# Runs only on main, only after CI is green. Credentials come from OIDC federation, not
# from stored keys: azure/login exchanges this run's GitHub token for an Azure token as the
# user-assigned identity itcs355-gha-id, whose federated credential trusts only
# repo:Guysiravich/public_teaching_mlaiops:environment:staging. No client secret exists.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    # workflow_run fires for every completed CI run; only a green one on a push to main
    # deploys. A pull request's CI run never reaches this job.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points at by the time this starts.
          ref: ${{ github.event.workflow_run.head_sha }}

      # --- Azure -------------------------------------------------------------
      # The three ids are identifiers, not credentials; they live in the secret store so the
      # subscription is not printed in a public repository's logs.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow the containerapp CLI extension to install itself
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Configuration from the secret store
        # STAGING_ENV holds the cloud.env lines CD needs, including the tracking server's
        # password. Written to cloud.env (gitignored) for this run only; src/config.py
        # reads it like any other environment.
        env:
          STAGING_ENV: ${{ secrets.STAGING_ENV }}
        run: |
          printf '%s\n' "$STAGING_ENV" > cloud.env
          grep -q '^MLFLOW_TRACKING_PASSWORD=.' cloud.env || { echo "STAGING_ENV secret is incomplete"; exit 1; }

      - name: Build serving image
        # Rebuilt here from the commit CI tested: the base image is pinned by digest and every
        # package by hash, so the bytes match what the integration test ran.
        run: docker build -f service/Dockerfile.serve -t itcs355-serve:$SHA .

      - name: Push image, deploy to staging, smoke test
        # One step, because each part needs the previous one's output: push_image returns the
        # digest deploy() runs, deploy() returns the URL the smoke test calls.
        env:
          RESOURCE_LAB: "4"
          SERVE_ENVIRONMENT: itcs355-env-l4
          SERVE_REVISIONS_MODE: Single
          SERVE_MIN_REPLICAS: "0"
          SERVE_MAX_REPLICAS: "1"
        run: |
          export REVISION_SUFFIX="g${SHA:0:7}"
          python scripts/deploy.py --alias staging --endpoint-name itcs355-staging \
            --instance 0.5/1.0Gi --image itcs355-serve:$SHA \
            --endpoint-file reports/lab4-staging-endpoint.txt
          echo "A deploy that is not smoke-tested is a deploy you have not verified."
